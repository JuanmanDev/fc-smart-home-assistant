add_user:
  name: Add user
  description: Adds a passcode, card or NFC user to a FC SmartHome lock.
  fields:
    device_id:
      name: Device
      description: The lock device id.
      required: true
      example: "1234567890"
      selector:
        text:
    name:
      name: Name
      description: Display name for the user.
      required: true
      example: "Guest"
      selector:
        text:
    user_type:
      name: User type
      description: Credential type to register.
      required: true
      selector:
        select:
          options:
            - label: "Password / passcode"
              value: "password"
            - label: "Card"
              value: "card"
            - label: "NFC"
              value: "nfc"
            - label: "Fingerprint"
              value: "finger"
    password:
      name: Passcode
      description: The numeric passcode (only for password type).
      required: false
      example: "8462"
      selector:
        text:
    card_id:
      name: Card ID
      description: Card/tag identifier (only for card/NFC types).
      required: false
      selector:
        text:
delete_user:
  name: Delete user
  description: Removes a user from a FC SmartHome lock.
  fields:
    device_id:
      name: Device
      description: The lock device id.
      required: true
      selector:
        text:
    user_id:
      name: User ID
      description: The lock user id to remove.
      required: true
      selector:
        text:
rename_user:
  name: Rename user
  description: Renames an existing lock user (e.g. a fingerprint slot).
  fields:
    device_id:
      name: Device
      required: true
      selector:
        text:
    user_id:
      name: User ID
      required: true
      selector:
        text:
    name:
      name: Name
      required: true
      selector:
        text:
enroll_fingerprint:
  name: Enroll fingerprint
  description: Starts fingerprint enrollment; touch the sensor on the lock several times.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        text:
    name:
      name: Name
      required: true
      selector:
        text:
fetch_history:
  name: Fetch history
  description: Pulls up to 100 recent access events and returns them (and fires events).
  fields:
    device_id:
      name: Device
      required: true
      selector:
        text:
ring_bell:
  name: Ring bell
  description: Rings the doorbell.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        text:
locate_device:
  name: Locate device
  description: Makes the device beep to locate it (useful for safes).
  fields:
    device_id:
      name: Device
      required: true
      selector:
        text:
set_child_lock:
  name: Set child lock
  description: Enables or disables child lock (blocks manual unlock from inside).
  fields:
    device_id:
      name: Device
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
