name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 28 * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HA Core Community Validation
        uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: python -m pyflakes custom_components/fc_smarthome/ fcctl/ tools/ tests/
      - run: pytest tests/ -q
